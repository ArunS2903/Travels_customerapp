org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off because its cache files could not be
# written reliably on this machine:
#
#   Could not close incremental caches in build\<module>\kotlin\
#   compileDebugKotlin\cacheable\caches-jvm\jvm\kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, ...
#
# It failed across several plugin modules at once and survived a `flutter
# clean`, which points at another process holding those files open rather than
# stale state - on-access antivirus scanning of the build directory is the
# usual cause on Windows.
#
# The cost is that Kotlin modules recompile in full instead of incrementally.
# These are plugin modules that rarely change, so the practical impact is
# small. If you exclude the project's build/ directory from your antivirus,
# you can delete this line to get incremental builds back.
kotlin.incremental=false
org.gradle.workers.max=2
